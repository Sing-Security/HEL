[package]
name = "hel"
version = "0.3.0"
edition = "2021"
description = "HEL — Heuristic Expression Language: a deterministic, auditable expression language & parser, AST, builtin registry and evaluator."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/Sing-Security/HEL"
homepage = "https://github.com/Sing-Security/HEL"
documentation = "https://docs.rs/hel"
authors = ["Joshua Fath <joshuaf@lfam.us>"]
keywords = ["expression-language", "dsl", "ast", "pest", "interpreter"]
categories = ["compilers", "parsing", "development-tools"]
# Driven by the dependency tree, not by the language features used here: `toml` -> `toml_edit`
# -> `indexmap`/`hashbrown` are what pin this. Declared so an older toolchain fails with a
# clear message instead of a confusing type error.
rust-version = "1.85"
publish = true

# Ship source, README, licence and manifest only. `hel-template/` is a standalone
# `BuiltinsProvider` example crate with its own manifest, not part of this crate's API.
exclude = [
  "target/**",
  ".github/**",
  "hel-template/**",
  "**/*.rs.bk",
]

[dependencies]
pest = "2.0"
pest_derive = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
bumpalo = { version = "3", features = ["collections"], optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
# Features stay minimal and additive. `arena` is on by default because it is a
# pure performance win with no API removed; `default-features = false` opts back
# out to the heap-allocated evaluator.
default = ["arena"]
arena = ["bumpalo"]

[[bench]]
name = "arena_bench"
harness = false
