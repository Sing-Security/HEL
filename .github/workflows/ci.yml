name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Format, Lint, Test, Package Dry-Run
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Caches the registry and `target/` itself.
      - name: Install Rust toolchain (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt

      - name: Show rustc / cargo versions
        run: |
          rustc --version
          cargo --version

      - name: Run rustfmt (check)
        run: |
          cargo fmt --all -- --check
          (cd hel-template && cargo fmt --check)
          (cd examples/c01-hel-embed && cargo fmt --check)

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests (default features)
        run: cargo test --all-features -- --nocapture

      - name: Run tests (no default features)
        run: cargo test --no-default-features -- --nocapture

      # hel-template and examples/c01-hel-embed are separate packages, so neither the
      # clippy nor the test step above reaches them.
      - name: Build and test the repo-local crates
        run: |
          (cd hel-template && cargo test)
          (cd examples/c01-hel-embed && cargo run --features acme_provider)

      - name: Build docs
        run: cargo doc --no-deps

      - name: cargo package dry-run
        run: cargo package --allow-dirty

      - name: cargo publish dry-run
        run: cargo publish --dry-run
